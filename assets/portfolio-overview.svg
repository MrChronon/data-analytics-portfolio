  <text x="176" y="381" fill="#94a3b8" font-family="Arial, sans-serif" font-size="22">→</text>
  <text x="210" y="381" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="18" font-weight="600">Проверка качества</text>
  <text x="382" y="381" fill="#94a3b8" font-family="Arial, sans-serif" font-size="22">→</text>
  <text x="416" y="381" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="18" font-weight="600">Метрики</text>
  <text x="503" y="381" fill="#94a3b8" font-family="Arial, sans-serif" font-size="22">→</text>
  <text x="537" y="381" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="18" font-weight="600">Выводы</text>

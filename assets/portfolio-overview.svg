  <text x="532" y="224" fill="#334155" font-family="Arial, sans-serif" font-size="17">SPSS • SciPy • statsmodels</text>
  <text x="532" y="253" fill="#334155" font-family="Arial, sans-serif" font-size="17">гипотезы • корреляции • регрессии</text>
  <text x="532" y="282" fill="#334155" font-family="Arial, sans-serif" font-size="17">A/B • интерпретация • исследовательский подход</text>

  <circle cx="986" cy="178" r="20" fill="#dcfce7"/>
  <path d="M977 179 H995 M986 170 V188 M974 168 L998 190" fill="none" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round"/>

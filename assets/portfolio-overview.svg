  <text x="969" y="224" fill="#334155" font-family="Arial, sans-serif" font-size="17">REST API • PostgreSQL • LLM</text>
  <text x="969" y="253" fill="#334155" font-family="Arial, sans-serif" font-size="17">Speech-to-Text • CRM workflows</text>
  <text x="969" y="282" fill="#334155" font-family="Arial, sans-serif" font-size="17">agentic workflows • local AI infrastructure</text>


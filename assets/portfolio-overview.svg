  <text x="780" y="381" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="18" font-weight="600">Автоматизация</text>
  <text x="1102" y="381" fill="#93c5fd" font-family="Arial, sans-serif" font-size="17" font-weight="700">Фокус: Data / Behavioral Analytics / Applied AI</text>
